name: Build & Push

on:
  push:
    branches: [main]


env:
  IMAGE_PRODUCER: ghcr.io/${{ github.repository }}/producer
  IMAGE_CONSUMER: ghcr.io/${{ github.repository }}/consumer


jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      # 1. Checkout repo
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 3. Build project
      - name: Build with Maven
        run: mvn clean package -DskipTests

      # 4. Login to GitHub Container Registry
      - name: Login to GHCR
        run: echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # 5. Build & Push Producer
      - name: Build & Push Producer
        run: |
          docker build -t $IMAGE_PRODUCER:${{ github.sha }} ./producer
          docker push $IMAGE_PRODUCER:${{ github.sha }}

      # 6. Build & Push Consumer
      - name: Build & Push Consumer
        run: |
          docker build -t $IMAGE_CONSUMER:${{ github.sha }} ./consumer
          docker push $IMAGE_CONSUMER:${{ github.sha }}


